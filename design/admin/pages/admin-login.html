<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex items-center justify-center p-4" style="font-family: var(--font-family-base), 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--color-surface-container-low);">
      <section class="w-full max-w-[420px] bg-card rounded-xl p-8 shadow-[0px_4px_8px_-2px_rgba(24,24,27,0.08)]">
        <header class="text-center mb-8">
          <div class="text-2xl font-bold text-foreground mb-2">真职 Zjob</div>
          <h1 class="text-xl font-semibold text-foreground">后台管理</h1>
        </header>
        <form class="space-y-5" novalidate>
          <div>
            <div class="relative">
              <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-muted-foreground"></i>
              <input type="text" data-dom-id="login-username" placeholder="运营账号" class="w-full h-12 pl-10 pr-4 rounded-lg border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
            </div>
            <p class="mt-1.5 text-sm text-destructive hidden" data-error="username">请输入运营账号</p>
          </div>
          <div>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-muted-foreground"></i>
              <input type="password" data-dom-id="login-password" placeholder="密码" class="w-full h-12 pl-10 pr-4 rounded-lg border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring" />
            </div>
            <p class="mt-1.5 text-sm text-destructive hidden" data-error="password">请输入密码</p>
          </div>
          <button type="submit" data-dom-id="login-submit" class="w-full h-12 rounded-lg bg-primary text-primary-foreground font-semibold hover:bg-[var(--color-primary-hover)] transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
            登录
          </button>
        </form>
        <footer class="mt-6 text-center">
          <p class="text-sm text-muted-foreground">仅内部运营人员使用</p>
        </footer>
      </section>
    </main>
